name: CI - Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  build-and-test:
    name: Build and Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install dependencies
        run: cd frontend/web && npm ci

      - name: Lint
        run: cd frontend/web && npm run lint --if-present

      - name: Run unit tests
        run: cd frontend/web && npm run test -- --no-watch --browsers=ChromeHeadless --code-coverage

      - name: Build production bundle
        run: cd frontend/web && npm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-frontend
          path: frontend/web/coverage/
          retention-days: 7