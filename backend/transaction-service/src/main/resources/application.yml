server:
  port: 8082

spring:
  application:
    name: transaction-service

  datasource:
    url: jdbc:postgresql://localhost:5432/transaction_db
    username: postgres
    password: 3128
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "[format_sql]": true


  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/onlinebanking

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    '[com.example.transaction]': DEBUG


example:
  transaction:
    services:
      account-service-url: http://localhost:8081
    rabbitmq:
      exchanges:
        transaction: transaction.exchange
      queues:
        transaction-created: transaction.created.queue
      routing-keys:
        transaction-created: transaction.created

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://postgres-transaction:5432/transaction_db
    username: postgres
    password: 3128

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/onlinebanking
          jwk-set-uri: http://keycloak:8080/realms/onlinebanking/protocol/openid-connect/certs

example:
  transaction:
    services:
      account-service-url: http://account-service:8081